<!-- Cold-start splash (inline so it paints before any JS/CSS loads). Written by Lone Keem -->
<style>
#kemy-splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(circle at 50% 40%,#2a0d4a 0,#0b0612 62%,#000 100%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;transition:opacity .35s ease}
#kemy-splash.out{opacity:0;pointer-events:none}
#kemy-splash .ks-logo{width:112px;height:112px;border-radius:26px;box-shadow:0 0 0 1px rgba(192,75,216,.5),0 0 34px rgba(138,43,226,.65);animation:ksPulse 1.6s ease-in-out infinite}
#kemy-splash h1{margin:8px 0 0;font-size:1.7rem;font-weight:800;letter-spacing:.2px;background:linear-gradient(90deg,#fff,#e3c8ff,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
#kemy-splash p{margin:0;font-size:.95rem;color:#c9a8f5;opacity:.9}
#kemy-splash .ks-bar{width:160px;height:4px;margin-top:18px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
#kemy-splash .ks-bar i{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,transparent,#a855f7,#e879f9,transparent);animation:ksShim 1.1s linear infinite}
@keyframes ksPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 1px rgba(192,75,216,.5),0 0 24px rgba(138,43,226,.45)}50%{transform:scale(1.05);box-shadow:0 0 0 1px rgba(192,75,216,.8),0 0 48px rgba(168,85,247,.85)}}
@keyframes ksShim{from{transform:translateX(-110%)}to{transform:translateX(290%)}}
@media (prefers-reduced-motion:reduce){#kemy-splash .ks-logo,#kemy-splash .ks-bar i{animation:none}}
</style>
<div id="kemy-splash" role="status" aria-label="Loading Kemy"><img class="ks-logo" src="icon-192.png" alt="" width="112" height="112"><h1>Welcome to Kemy</h1><p>by Lone Keem Studios</p><div class="ks-bar"><i></i></div></div>
<script>
(function(){var s=document.getElementById('kemy-splash');try{if(sessionStorage.getItem('kemy-splashed')){s.remove();return;}sessionStorage.setItem('kemy-splashed','1');}catch(e){}
var t0=Date.now(),done=false;function hide(){if(done)return;done=true;setTimeout(function(){s.classList.add('out');setTimeout(function(){s.remove();},400);},Math.max(0,600-(Date.now()-t0)));}
setTimeout(hide,8000);
function ready(){var m=document.getElementById('main');if(true){return m&&m.children.length&&!m.querySelector(':scope > .spinner, :scope > .feed-skel');}return document.readyState!=='loading';}
(function poll(){if(done)return;if(ready())setTimeout(hide,30);else setTimeout(poll,80);})();})();
</script>
