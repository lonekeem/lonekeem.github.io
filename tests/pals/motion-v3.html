<!doctype html><meta charset="utf-8"><body style="margin:0;background:#1b0f3a"><canvas id="c" width="1280" height="720"></canvas>
<script type="module">
// Motion v3 visual check: 4 species, 4 dances, walk, walk->run, jump. window.frame(i) draws frame i (60 fps).
import { drawPal3D } from '../../js/pals/pal3d.js';
import { walkPxPerFrame } from '../../js/pals/motion3d.js';
import { drawBg } from '../../js/pals/bgs.js';
const c = document.getElementById('c').getContext('2d');
const SP = ['kemy', 'bear', 'elephant', 'corgi'];
const outfit = new URLSearchParams(location.search).has('outfit') ? { head: 'crown', body: 'hoodie', feet: 'sneakers' } : undefined;
const SEG = [['dance', 'bodyroll', 180], ['dance', 'hula', 180], ['dance', 'shuffle', 180], ['dance', 'hopclap', 180], ['walk', 1, 180], ['run', 0, 180], ['jump', 0, 120]];
window.TOTAL = SEG.reduce((a, s) => a + s[2], 0);
const xs = SP.map(() => 0);
window.frame = (i) => {
  let k = i, seg = SEG[0]; for (const s of SEG) { if (k < s[2]) { seg = s; break; } k -= s[2]; }
  c.fillStyle = '#2a1458'; c.fillRect(0, 0, 1280, 720);
  const g = c.createLinearGradient(0, 470, 0, 720); g.addColorStop(0, '#5a3d9a'); g.addColorStop(1, '#3a2470'); c.fillStyle = g; c.fillRect(0, 470, 1280, 250);
  c.strokeStyle = 'rgba(255,255,255,.12)'; for (let x = 0; x < 1280; x += 40) { c.beginPath(); c.moveTo(x, 470); c.lineTo(x, 720); c.stroke(); }
  let label = '', mode = 'idle', st = {};
  if (seg[0] === 'dance') { label = 'Dance: ' + seg[1]; st = { dance3d: seg[1], beat: k / 30, amt: 1 }; }
  else if (seg[0] === 'walk') { label = 'Walk (feet locked, stride matched to speed)'; mode = 'walk'; st = { speed: 1 }; }
  else if (seg[0] === 'run') { const sp = 0.6 + Math.min(1, k / 120) * 1.6; label = 'Walk -> run blend, speed ' + sp.toFixed(1); mode = 'walk'; st = { speed: sp, turn: Math.sin(k / 40) * 0.6 }; }
  else { label = 'Jump: anticipation, stretch, squash on landing'; mode = 'hop'; }
  c.fillStyle = '#ffd34d'; c.font = '700 30px sans-serif'; c.fillText(label, 30, 50);
  c.fillStyle = '#e9dcff'; c.font = '600 18px sans-serif';
  SP.forEach((id, j) => {
    const size = 230, y = 640; let x = 170 + j * 315;
    if (mode === 'walk') { xs[j] += walkPxPerFrame(size, st.speed) * 0.75; x = 40 + ((170 + j * 315 - 40 + xs[j]) % 1240 + 1240) % 1240; } else xs[j] = 0;
    drawPal3D(c, x, y, size, { species: id, level: 6, outfit }, { t: i, mode, face: 1, yaw: mode === 'walk' ? Math.PI / 2 - 0.25 : 0.3, ...st });
    c.fillText(id === 'kemy' ? 'axolotl (Kemy)' : id, 170 + j * 315 - 30, 700);
  });
};
window.ready = true;
</script>
