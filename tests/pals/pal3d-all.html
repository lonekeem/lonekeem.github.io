<!doctype html><meta charset="utf-8"><body style="margin:0;background:#2a1458"><canvas id="c" width="1300" height="2100"></canvas>
<script type="module">
import { drawPal3D } from '../../js/pals/pal3d.js';
import { SPECIES } from '../../js/pals/art.js';
const c = document.getElementById('c').getContext('2d'); c.font = '600 11px sans-serif';
const done = []; let t = 0; const go = () => { t++; let all = true, n = 0;
  SPECIES.forEach((sp, i) => { if (done[i]) return; if (n++ > 5) { all = false; return; } const x = (i % 10) * 130, y = Math.floor(i / 10) * 160;
    if (drawPal3D(c, x + 65, y + 150, 80, { species: sp.id, level: 6, colors: { body: sp.body, accent: sp.acc, eye: '#24133f' }, outfit: JSON.parse(new URLSearchParams(location.search).get('o') || '{}') }, { t: 30, mode: 'idle', yaw: 0.45 })) { done[i] = 1; c.fillStyle = sp.rare ? '#ffd34d' : '#fff'; c.fillText((sp.rare ? '★ ' : '') + sp.name, x + 4, y + 14); } else all = false; });
  if (!all && t < 400) requestAnimationFrame(go); else window.ready = true; };
setTimeout(go, 300);
</script>
