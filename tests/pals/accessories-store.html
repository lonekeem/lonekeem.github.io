<script type="module">

const pal = { id: 'p1', name: 'Bloop', species: new URLSearchParams(location.search).get('sp') || 'bear', level: 6, outfit: { ears: 'hoops_gold', neck: 'f_beads_pink', wrist: 'f_bracelet_gold', head: 'f_bow_pink' }, colors: {} };
