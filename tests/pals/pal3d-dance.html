<!doctype html><meta charset="utf-8"><body style="margin:0;background:#2a1458"><canvas id="c" width="640" height="360"></canvas>
<script type="module">
import { drawDancer, load3D, danceById, loadTrends } from '../../js/pals/dance.js';
await load3D(); await loadTrends();
const c = document.getElementById('c').getContext('2d'); const seq = (new URLSearchParams(location.search).get('seq') || 'renegroove,appledance,dlowshuffle,toeslide,giddyup,griddy,footfree,trapstairs,wigglewalk,diceroll').split(',');
window.frame = (t) => { const id = seq[Math.floor(t / 160) % seq.length]; const d = danceById(id); c.fillStyle = '#2a1458'; c.fillRect(0, 0, 640, 360);
  drawDancer(c, 200, 330, 150, { species: 'kitten', level: 6, outfit: { feet: 'sneakers' } }, { t, dance: d, beat: t / 30 });
  drawDancer(c, 460, 330, 120, { species: 'fox', level: 6 }, { t, dance: d, beat: t / 30 + 0.08, label: false }); };
window.ready = true;
</script>
