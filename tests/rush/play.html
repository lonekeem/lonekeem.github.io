<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="../../css/app.css"><link rel="stylesheet" href="../../css/rush.css"><title>loading</title></head><body>
<script type="module">
import { startRun } from '../../js/rush/game.js';
import { STAGE } from '../../js/rush/data.js';
import { CAPY } from '../../js/rush/driver.js';
const q = new URLSearchParams(location.search), mode = q.get('mode') || 'solo';
const bots = mode === 'cpu' ? [{ name: 'Capy Bot', pal: CAPY, vid: 'hauler', skill: 0.6 }, { name: 'Kemy Bot', vid: 'zoom', skill: 0.8 }, { name: 'Zippy', pal: CAPY, vid: 'buggy', skill: 0.7 }] : [];
const g = await startRun({ stage: STAGE[q.get('st') || 'countryside'], vid: q.get('v') || 'scout', seed: +q.get('seed') || 777, mode, raceLen: 600, bots,
  startAt: mode !== 'solo' ? Date.now() + (+q.get('cd') || 0) : 0, onEnd: (r) => { window.RES = r; document.title = 'end'; } });
window.G = g;
// optional auto-drive for screenshots: hold gas for N seconds then snapshot
const secs = +q.get('auto') || 0;
if (secs) { const t0 = performance.now(); const tick = () => { const el = g.root.querySelector('.gas'); if (performance.now() - t0 < secs * 1000) { dispatchEvent(new KeyboardEvent('keydown', { code: 'ArrowRight' })); requestAnimationFrame(tick); } else { dispatchEvent(new KeyboardEvent('keyup', { code: 'ArrowRight' })); setTimeout(() => document.title = 'done', 200); } }; tick(); }
else setTimeout(() => document.title = 'done', 1500);
</script></body></html>
