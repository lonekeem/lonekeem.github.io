<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#8a2be2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lone Keem">
    <title>Lone Keem Studios</title>
    <style>
        /* General Styles */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1, h2 {
            text-align: center;
        }

        /* Purple Accents */
        h1 { color: #8a2be2; } /* BlueViolet for Title */
        h2 { border-bottom: 2px solid #8a2be2; padding-bottom: 10px; }

        /* Media Section */
        .section { margin-bottom: 40px; }
        .media-item {
            border: 1px solid #8a2be2;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
        }

        /* Button */
        .btn {
            background-color: #8a2be2;
            color: #ffffff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn:hover { background-color: #5d1a99; }
        /* Music Videos */
        .video-card { border: 1px solid #8a2be2; border-radius: 8px; padding: 15px; margin: 15px auto; max-width: 420px; text-align: center; }
        .video-card h3 { margin-top: 0; color: #8a2be2; }
        .video-card video { width: 100%; border-radius: 6px; background: #000; }
    </style>
</head>
<body>

    <h1>Lone Keem Studios</h1>

    <div class="section">
        <h2>Movies</h2>
        <!-- Replace the content below to add more movies -->
        <div class="media-item">
            <span>[Movie Title 1]</span>
            <a href="[Link URL]" class="btn">Watch Now</a>
        </div>
        <div class="media-item">
            <span>[Movie Title 2]</span>
            <a href="[Link URL]" class="btn">Watch Now</a>
        </div>
    </div>

    <div class="section">
        <h2>Music Videos</h2>
        <div class="video-card">
            <h3>Stand Up Strong</h3>
            <video controls playsinline preload="metadata" poster="videos/stand-up-strong.jpg">
                <source src="videos/stand-up-strong.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <div class="section">
        <h2>Songs</h2>
        <!-- Replace the content below to add more songs -->
        <div class="media-item">
            <span>[Song Title 1]</span>
            <a href="[Link URL]" class="btn">Listen Now</a>
        </div>
        <div class="media-item">
            <span>[Song Title 2]</span>
            <a href="[Link URL]" class="btn">Listen Now</a>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
        }
    </script>
</body>
</html>
